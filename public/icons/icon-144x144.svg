<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Soft Google-style elevation shadow -->
    <filter id="elevShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0D9488" flood-opacity="0.25" />
    </filter>

    <!-- Core Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <!-- Google 4-Color Vibrant Palette -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#FF5A43" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#5C9DFF" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC04" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="tealCenter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Adaptive Maskable Google Squircle Background -->
  <rect x="28" y="28" width="456" height="456" rx="112" fill="url(#bgGrad)" filter="url(#elevShadow)" />
  <rect x="28" y="28" width="456" height="456" rx="112" stroke="#F1F5F9" stroke-width="3" />

  <!-- Outer Google Lens Corners (Red, Blue, Green, Yellow) -->
  <g stroke-linecap="round" stroke-linejoin="round" stroke-width="36">
    <!-- Top-Left Lens Bracket (Red) -->
    <path d="M 136 212 V 172 C 136 152.12 152.12 136 172 136 H 212" stroke="url(#redGrad)" />
    
    <!-- Top-Right Lens Bracket (Blue) -->
    <path d="M 300 136 H 340 C 359.88 136 376 152.12 376 172 V 212" stroke="url(#blueGrad)" />

    <!-- Bottom-Right Lens Bracket (Green) -->
    <path d="M 376 300 V 340 C 376 359.88 359.88 376 340 376 H 300" stroke="url(#greenGrad)" />

    <!-- Bottom-Left Lens Bracket (Yellow) -->
    <path d="M 212 376 H 172 C 152.12 376 136 359.88 136 340 V 300" stroke="url(#yellowGrad)" />
  </g>

  <!-- Center Google Health Cross & Optical Aperture Element -->
  <g filter="url(#glowEffect)">
    <!-- Central Medical Cross Core with Rounded Smooth Geometry -->
    <rect x="234" y="196" width="44" height="120" rx="22" fill="url(#tealCenter)" />
    <rect x="196" y="234" width="120" height="44" rx="22" fill="url(#tealCenter)" />

    <!-- Inner Vital Pulse Core Node -->
    <circle cx="256" cy="256" r="28" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="16" fill="url(#tealCenter)" />
  </g>

  <!-- Focus Aperture Micro-Pips (Scanner Dots) -->
  <circle cx="256" cy="148" r="7" fill="#4285F4" />
  <circle cx="364" cy="256" r="7" fill="#34A853" />
  <circle cx="256" cy="364" r="7" fill="#FBBC04" />
  <circle cx="148" cy="256" r="7" fill="#EA4335" />
</svg>