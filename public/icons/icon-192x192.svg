<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Ultra-Deep Ambient & Specular Lighting Shadows -->
    <filter id="ambientShadow" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0F172A" flood-opacity="0.14" />
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00F2FE" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="4" stdDeviation="16" flood-color="#10B981" flood-opacity="0.45" />
    </filter>

    <filter id="crossGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#059669" flood-opacity="0.35" />
    </filter>

    <!-- Glassmorphic Canvas Gradients -->
    <linearGradient id="glassCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#E2E8F0" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.5" />
    </linearGradient>

    <!-- Emerald-Cyan Medical Cross Gradient -->
    <linearGradient id="emeraldGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="30%" stop-color="#10B981" />
      <stop offset="70%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="crossBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.4" />
    </linearGradient>

    <!-- Deep Space Optical Lens Barrel -->
    <radialGradient id="lensBarrel" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="75%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <linearGradient id="irisRing1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="irisRing2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Electric Neon Heartbeat Line Gradient -->
    <linearGradient id="pulseElectric" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="35%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#22D3EE" />
      <stop offset="78%" stop-color="#F43F5E" />
      <stop offset="88%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Glass Specular Reflection Gradient -->
    <linearGradient id="specularArc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- 1. Apple/Google Grade Glass Squircle Base -->
  <rect x="28" y="28" width="456" height="456" rx="116" fill="url(#glassCanvas)" filter="url(#ambientShadow)" />
  <rect x="28" y="28" width="456" height="456" rx="116" stroke="url(#rimStroke)" stroke-width="3.5" />

  <!-- 2. Integrated Medical Cross & Optical Geometry -->
  <g filter="url(#crossGlow)">
    <!-- Base Medical Cross in Layered Emerald-Teal Glass -->
    <path d="
      M 200 120 
      H 312 
      A 28 28 0 0 1 340 148 
      V 200 
      H 392 
      A 28 28 0 0 1 420 228 
      V 284 
      A 28 28 0 0 1 392 312 
      H 340 
      V 364 
      A 28 28 0 0 1 312 392 
      H 200 
      A 28 28 0 0 1 172 364 
      V 312 
      H 120 
      A 28 28 0 0 1 92 284 
      V 228 
      A 28 28 0 0 1 120 200 
      H 172 
      V 148 
      A 28 28 0 0 1 200 120 
      Z" 
      fill="url(#emeraldGlass)" 
    />
    <!-- Inner Cross Bevel Shading -->
    <path d="
      M 200 120 
      H 312 
      A 28 28 0 0 1 340 148 
      V 200 
      H 392 
      A 28 28 0 0 1 420 228 
      V 284 
      A 28 28 0 0 1 392 312 
      H 340 
      V 364 
      A 28 28 0 0 1 312 392 
      H 200 
      A 28 28 0 0 1 172 364 
      V 312 
      H 120 
      A 28 28 0 0 1 92 284 
      V 228 
      A 28 28 0 0 1 120 200 
      H 172 
      V 148 
      A 28 28 0 0 1 200 120 
      Z" 
      stroke="url(#crossBevel)" 
      stroke-width="4" 
    />
  </g>

  <!-- 3. High-Precision Optical Camera Lens Barrel (Centered at Cross Junction) -->
  <g>
    <!-- Outer Lens Ring -->
    <circle cx="256" cy="256" r="102" fill="url(#lensBarrel)" stroke="#334155" stroke-width="4" />
    <circle cx="256" cy="256" r="94" stroke="url(#irisRing1)" stroke-width="3.5" opacity="0.8" />
    
    <!-- Concentric Optics Iris -->
    <circle cx="256" cy="256" r="76" fill="#020617" stroke="url(#irisRing2)" stroke-width="5" />
    <circle cx="256" cy="256" r="54" fill="#090D16" stroke="#1E293B" stroke-width="3" />
    <circle cx="256" cy="256" r="34" fill="#020617" />
    
    <!-- Deep Lens Pupil with Prismatic Reflection -->
    <circle cx="246" cy="244" r="12" fill="#38BDF8" opacity="0.6" />
    <circle cx="242" cy="240" r="5" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- 4. Luminous Electric ECG Vital Pulse Waveform -->
  <g filter="url(#neonGlow)">
    <path d="
      M 94 256 
      H 162 
      L 186 256 
      L 208 206 
      L 236 322 
      L 264 168 
      L 288 304 
      L 308 234 
      L 324 256 
      H 418" 
      stroke="url(#pulseElectric)" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <!-- Core Bright White Laser Spine -->
    <path d="
      M 94 256 
      H 162 
      L 186 256 
      L 208 206 
      L 236 322 
      L 264 168 
      L 288 304 
      L 308 234 
      L 324 256 
      H 418" 
      stroke="#FFFFFF" 
      stroke-width="4.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      opacity="0.9"
    />
  </g>

  <!-- 5. Optical Scanner Targeting Reticles (4 Precision Pointers) -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="134" x2="256" y2="148" />
    <line x1="256" y1="364" x2="256" y2="378" />
    <line x1="134" y1="256" x2="148" y2="256" />
    <line x1="364" y1="256" x2="378" y2="256" />
  </g>

  <!-- 6. Glossy Glass Specular Highlights (Top Curve) -->
  <path d="
    M 56 68 
    C 140 40 372 40 456 68 
    C 420 120 320 156 56 124 
    Z" 
    fill="url(#specularArc)" 
    opacity="0.65" 
  />
</svg>